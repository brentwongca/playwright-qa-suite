name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Both applications under test are third-party demo services, so a nightly
    # run tells me when they change under the suite rather than when I change
    # the suite.
    - cron: "0 13 * * *"

jobs:
  api:
    name: API layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No browser needed here, which is why this job finishes in under a
      # minute and gives the fastest signal of the two.
      - name: Run the API tests
        run: python -m pytest tests/api --html=reports/api-report.html --self-contained-html

      - name: Publish the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-api
          path: reports/
          retention-days: 14

  ui:
    name: UI layer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the UI tests
        run: python -m pytest tests/ui -n 2 --html=reports/ui-report.html --self-contained-html

      - name: Publish the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-ui
          path: reports/
          retention-days: 14
