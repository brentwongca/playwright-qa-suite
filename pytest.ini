[pytest]
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: minimal set that must pass before any deeper run
    login: authentication behaviour
    inventory: product listing, sorting and filtering
    cart: cart contents and totals
    checkout: checkout form validation and order completion
    api: Restful Booker API layer
    auth: token issuing and the writes that need one
    booking: the booking lifecycle and its validation
